experiments:
  phase0_smoke:
    description: "Convert CUAD-style JSON into RuleFrame JSONL and run oracle smoke evaluation."
    input: "examples/cuad_sample.json"
    ruleframe_output: "outputs/phase0_smoke/cuad_sample.ruleframe.jsonl"
    summary_output: "outputs/phase0_smoke/summary.json"
    predictions_output: "outputs/phase0_smoke/predictions.jsonl"
    results_output: "outputs/phase0_smoke/results.json"
    commands:
      convert: "PYTHONPATH=src python3 -m rulex.cli.cuad_to_ruleframe examples/cuad_sample.json outputs/phase0_smoke/cuad_sample.ruleframe.jsonl"
      summarize: "PYTHONPATH=src python3 -m rulex.cli.summarize_ruleframes outputs/phase0_smoke/cuad_sample.ruleframe.jsonl outputs/phase0_smoke/summary.json"
      smoke_eval: "PYTHONPATH=src python3 -m rulex.cli.smoke_eval outputs/phase0_smoke/cuad_sample.ruleframe.jsonl outputs/phase0_smoke/predictions.jsonl outputs/phase0_smoke/results.json"
  phase0_cuad_full:
    description: "Convert the official CUADv1.json into RuleFrame JSONL and summarize the full corpus."
    input: "data/raw/cuad/CUADv1.json"
    ruleframe_output: "data/processed/ruleframe/cuad.jsonl"
    summary_output: "reports/tables/phase0_cuad_summary.json"
    predictions_output: "outputs/phase0_cuad_oracle/predictions.jsonl"
    results_output: "outputs/phase0_cuad_oracle/results.json"
    commands:
      convert: "PYTHONPATH=src python3 -m rulex.cli.cuad_to_ruleframe data/raw/cuad/CUADv1.json data/processed/ruleframe/cuad.jsonl"
      summarize: "PYTHONPATH=src python3 -m rulex.cli.summarize_ruleframes data/processed/ruleframe/cuad.jsonl reports/tables/phase0_cuad_summary.json"
      oracle_smoke_eval: "PYTHONPATH=src python3 -m rulex.cli.smoke_eval data/processed/ruleframe/cuad.jsonl outputs/phase0_cuad_oracle/predictions.jsonl outputs/phase0_cuad_oracle/results.json"
  phase1_cuad_split_diagnostics:
    description: "Prepare official CUAD train/test splits and write per-rule-type difficulty profiles."
    train_input: "data/raw/cuad/train_separate_questions.json"
    test_input: "data/raw/cuad/test.json"
    train_ruleframe_output: "data/processed/ruleframe/cuad_train.jsonl"
    test_ruleframe_output: "data/processed/ruleframe/cuad_test.jsonl"
    train_summary_output: "reports/tables/phase1_cuad_train_summary.json"
    test_summary_output: "reports/tables/phase1_cuad_test_summary.json"
    train_profile_output: "reports/tables/phase1_cuad_train_rule_type_profile.csv"
    test_profile_output: "reports/tables/phase1_cuad_test_rule_type_profile.csv"
    commands:
      convert_train: "PYTHONPATH=src python3 -m rulex.cli.cuad_to_ruleframe data/raw/cuad/train_separate_questions.json data/processed/ruleframe/cuad_train.jsonl"
      convert_test: "PYTHONPATH=src python3 -m rulex.cli.cuad_to_ruleframe data/raw/cuad/test.json data/processed/ruleframe/cuad_test.jsonl"
      summarize_train: "PYTHONPATH=src python3 -m rulex.cli.summarize_ruleframes data/processed/ruleframe/cuad_train.jsonl reports/tables/phase1_cuad_train_summary.json"
      summarize_test: "PYTHONPATH=src python3 -m rulex.cli.summarize_ruleframes data/processed/ruleframe/cuad_test.jsonl reports/tables/phase1_cuad_test_summary.json"
      profile_train: "PYTHONPATH=src python3 -m rulex.cli.profile_rule_types data/processed/ruleframe/cuad_train.jsonl reports/tables/phase1_cuad_train_rule_type_profile.csv"
      profile_test: "PYTHONPATH=src python3 -m rulex.cli.profile_rule_types data/processed/ruleframe/cuad_test.jsonl reports/tables/phase1_cuad_test_rule_type_profile.csv"
  phase1_null_baseline:
    description: "Always predict no spans on the CUAD test split to calibrate no-answer behavior."
    input: "data/processed/ruleframe/cuad_test.jsonl"
    predictions_output: "outputs/phase1_null_baseline_test/predictions.jsonl"
    results_output: "reports/tables/phase1_null_baseline_test_results.json"
    commands:
      run: "PYTHONPATH=src python3 -m rulex.cli.null_baseline data/processed/ruleframe/cuad_test.jsonl outputs/phase1_null_baseline_test/predictions.jsonl reports/tables/phase1_null_baseline_test_results.json"
